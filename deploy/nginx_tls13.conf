# Phase 11 production TLS termination example for the ANPR FastAPI app.
# Replace hostnames and certificate paths during deployment. Do not commit real keys.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name anpr.example.gov;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name anpr.example.gov;

    ssl_certificate /etc/letsencrypt/live/anpr.example.gov/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anpr.example.gov/privkey.pem;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ANPRTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
